spring:
  config:
    import: naver-sms.properties

  datasource:
    url: your-url
    driver-class-name: your-url
    username: root
    password: your-password

  redis:
    host: your-url
    port: your-port
    password: your-password
    sentinel:
      password: your-password


  # ddl-auto: create -> Entity에 맞게 자동으로 테이블 및 필드 생성 [배포에선 사용 X]
  # show-sql: true -> 해당하는 query를 보여줌 (JPA N + 1 문제 확인용) [배포에선 사용 X]
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: false
        format_sql: false

  # paging index를 들어올 때 1부터 시작하는 설정
  data:
    web:
      pageable:
        one-indexed-parameters: true
server:
  port: 5000
